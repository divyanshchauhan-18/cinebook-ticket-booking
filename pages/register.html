<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | CineBook</title>
  <meta name="description" content="Book movie tickets online with CineBook.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container" id="main">
    <div class="narrow">
      <h1>Create your account</h1>
      <form id="registerForm" class="card" novalidate>
        <div class="form-error hidden" role="alert"></div>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" autocomplete="name" required minlength="2">
          <span class="err" data-err="name"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <span class="err" data-err="email"></span>
        </div>
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
          <span class="err" data-err="phone"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
            <button type="button" aria-label="Show or hide password">Show</button>
          </div>
          <span class="hint">At least 8 characters.</span>
          <span class="err" data-err="password"></span>
        </div>
        <button class="btn btn-block" type="submit">Sign up</button>
        <p class="muted" style="margin:1rem 0 0">Already registered? <a href="login.html">Log in</a></p>
      </form>
    </div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="../js/pages/register.js"></script>
</body>
</html>
