<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings | CineBook</title>
  <meta name="description" content="Book movie tickets online with CineBook.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container" id="main">
    <div class="page-head"><h1>My bookings</h1></div>
    <div class="tabs" id="statusTabs" role="tablist" aria-label="Booking status">
      <button class="tab" role="tab" data-status="" aria-selected="true">All</button>
      <button class="tab" role="tab" data-status="confirmed" aria-selected="false">Confirmed</button>
      <button class="tab" role="tab" data-status="cancelled" aria-selected="false">Cancelled</button>
    </div>
    <div id="list" aria-live="polite"></div>
    <div id="pagination" class="pagination"></div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="../js/pages/bookings.js"></script>
</body>
</html>
