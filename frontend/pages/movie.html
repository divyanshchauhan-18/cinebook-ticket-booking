<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie | CineBook</title>
  <meta name="description" content="Book movie tickets online with CineBook.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header id="navbar"></header>
  <main class="container" id="main">
    <div id="movieDetail"></div>
    <section aria-labelledby="showsHeading">
      <div class="page-head">
        <h2 id="showsHeading" style="margin:0">Showtimes</h2>
        <div class="field" style="margin:0;min-width:200px">
          <label for="city" class="sr-only">City</label>
          <select id="city"><option value="">All cities</option></select>
        </div>
      </div>
      <div id="dateChips" class="date-chips" role="tablist" aria-label="Choose a date"></div>
      <div id="showList" class="card" aria-live="polite"></div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="../js/pages/movie.js"></script>
</body>
</html>
